<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add New Order</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container mt-4">
      <h1>Add New Order</h1>
      <form
        th:action="@{/admin/orders/add}"
        th:object="${order}"
        method="post"
      >
        <!-- User (Customer) -->
        <div class="mb-3">
          <label for="user" class="form-label">Customer</label>
          <select
            id="user"
            class="form-select"
            th:field="*{user.id}"
            required
          >
            <option value="" disabled selected>Select a user</option>
            <option
              th:each="u : ${users}"
              th:value="${u.id}"
              th:text="${u.username}"
            ></option>
          </select>
        </div>

        <!-- Pet -->
        <div class="mb-3">
          <label for="pet" class="form-label">Select Pet</label>
          <select
            id="pet"
            class="form-select"
            th:field="*{pet.id}"
            required
          >
            <option value="" disabled selected>Select a pet</option>
            <option
              th:each="p : ${pets}"
              th:value="${p.id}"
              th:text="${p.name}"
            ></option>
          </select>
        </div>

        <!-- Address -->
        <div class="mb-3">
          <label for="address" class="form-label">Select Address</label>
          <select
            id="address"
            class="form-select"
            th:field="*{address.id}"
            required
          >
            <option value="" disabled selected>Select an address</option>
            <option
              th:each="addr : ${addresses}"
              th:value="${addr.id}"
              th:text="${addr.fullAddress}"
            ></option>
          </select>
        </div>

        <!-- Quantity -->
        <div class="mb-3">
          <label for="quantity" class="form-label">Quantity</label>
          <input
            type="number"
            id="quantity"
            class="form-control"
            th:field="*{quantity}"
            placeholder="Enter quantity"
            min="1"
            required
          />
        </div>

        <!-- Status -->
        <div class="mb-3">
          <label for="status" class="form-label">Order Status</label>
          <select id="status" class="form-select" th:field="*{status}">
            <option
              th:each="stat : ${T(com.example.petstore.model.enums.OrderStatus).values()}"
              th:value="${stat}"
              th:text="${stat}"
            ></option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary">Add Order</button>
        <a th:href="@{/admin/orders}" class="btn btn-secondary ms-3">Cancel</a>
      </form>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>
  </body>
</html>
