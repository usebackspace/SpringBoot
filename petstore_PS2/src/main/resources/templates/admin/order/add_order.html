<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Add New Order</h2>

    <form th:action="@{/admin/orders/add}" th:object="${order}" method="post">

        <!-- User -->
        <div class="mb-3">
            <label>User</label>
            <select th:field="*{user.id}" class="form-select" required>
                <option value=""  selected>Select User</option>
                <option th:each="user : ${users}" th:value="${user.id}" th:text="${user.username}"></option>
            </select>
        </div>

        <!-- Pet -->
        <div class="mb-3">
            <label>Pet</label>
            <select th:field="*{pet.id}" class="form-select" required>
                <option value="" selected>Select Pet</option>
                <option th:each="pet : ${pets}" th:value="${pet.id}" th:text="${pet.name}"></option>
            </select>
        </div>

        <!-- Address -->
        <div class="mb-3">
            <label>City</label>
            <select th:field="*{address.id}" class="form-select" required>
                <option value="" selected>Select City</option>
                <option th:each="address : ${addresses}" th:value="${address.id}" th:text="${address.city}"></option>
            </select>
        </div>

        <!-- Quantity -->
        <div class="mb-3">
            <label>Quantity</label>
            <input type="number" th:field="*{quantity}" class="form-control" min="1" value="1" required />
        </div>

        <!-- Buttons -->
        <button type="submit" class="btn btn-success">Save</button>
        <a th:href="@{/admin/orders}" class="btn btn-secondary">Cancel</a>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
