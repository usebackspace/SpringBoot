spring.application.name=CRUD

spring.datasource.url=jdbc:mysql://localhost:3306/avengers_spring
spring.datasource.username=root
spring.datasource.password=root

# JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# Different databases (MySQL, PostgreSQL, Oracle, SQL Server) have slightly different SQL syntax, types, and functions. Hibernate uses the dialect to generate SQL that the database understands.