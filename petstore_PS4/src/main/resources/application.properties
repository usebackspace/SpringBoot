spring.application.name=petstore

spring.datasource.url=jdbc:mysql://localhost:3306/petstore
spring.datasource.username=root
spring.datasource.password=root

# JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


spring.thymeleaf.cache=false


# Different databases (MySQL, PostgreSQL, Oracle, SQL Server) have slightly different SQL syntax, types, and functions. Hibernate uses the dialect to generate SQL that the database understands.